<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giới thiệu cá nhân</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #24415f;
      background: #eaf4ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
    }
    main {
      width: min(100%, 680px);
      padding: clamp(26px, 6vw, 48px);
      background: #fff;
      border: 1px solid #e5eaf2;
      border-radius: 20px;
      box-shadow: 0 16px 44px rgba(35, 55, 90, .08);
    }
    .eyebrow {
      margin: 0 0 8px;
      color: #4f8fc9;
      font-size: .85rem;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 28px; font-size: clamp(1.8rem, 5vw, 2.5rem); }
    section { padding: 18px 0; border-top: 1px solid #edf0f5; }
    h2 { margin: 0 0 7px; font-size: 1rem; color: #53627a; }
    footer { margin-top: 22px; padding-top: 18px; border-top: 1px solid #edf0f5; color: #6b7c93; font-size: .9rem; text-align: center; }
    p { margin: 0; line-height: 1.65; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Giới thiệu cá nhân</p>
    <h1>Lê Trường Giang</h1>
    <section>
      <h2>Chuyên ngành</h2>
      <p>Quang Hệ Công Chúng</p>
    </section>
    <section>
      <h2>Kỹ năng</h2>
      <p>Làm sự kiện, tổ chức sự kiện</p>
    </section>
    <section>
      <h2>Mục tiêu nghề nghiệp</h2>
      <p>ky su</p>
    </section>
      <footer>Được tạo bằng Codex.</footer>
  </main>
</body>
</html>
